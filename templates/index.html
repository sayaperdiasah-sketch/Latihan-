<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analis Medis AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 500px; height: 85vh; background: white; border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid #e1e4e8; }
        .chat-header { background: #007bff; color: white; padding: 20px; text-align: center; font-size: 1.25rem; font-weight: bold; letter-spacing: 0.5px; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fafafa; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .user-msg { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 2px 5px rgba(0,123,255,0.2); }
        .bot-msg { background: #ffffff; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #e1e4e8; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .chat-input-area { display: flex; padding: 15px; background: #fff; border-top: 1px solid #edeef0; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 14px 20px; border: 1px solid #dcdcdc; border-radius: 24px; outline: none; font-size: 0.95rem; transition: border 0.2s; }
        .chat-input-area input:focus { border-color: #007bff; }
        .chat-input-area button { background: #007bff; color: white; border: none; padding: 0 24px; border-radius: 24px; cursor: pointer; font-weight: bold; font-size: 0.95rem; transition: background 0.2s; }
        .chat-input-area button:hover { background: #0056b3; }
        .loading { font-style: italic; color: #888; background: transparent !important; border: none !important; box-shadow: none !important; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header"> 🩺 Asisten Medis AI</div>
    <div class="chat-box" id="chatBox">
        <div class="message bot-msg">Halo! Saya asisten AI medis. Silakan konsultasikan gejala atau keluhan kesehatan yang sedang Anda rasakan secara umum di sini.</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Ketik gejala yang Anda rasakan..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Kirim</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user-msg');
        userInput.value = '';

        const loadingDiv = appendMessage('Sedang menganalisis medis...', 'bot-msg loading');

        try {
            const response = await fetch('/get_response', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await response.json();
            
            loadingDiv.remove();
            appendMessage(data.reply, 'bot-msg');
        } catch (error) {
            loadingDiv.remove();
            appendMessage('Terjadi gangguan jaringan atau API server sedang sibuk.', 'bot-msg');
        }
    }

    function appendMessage(text, className) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return messageDiv;
    }
</script>

</body>
</html>

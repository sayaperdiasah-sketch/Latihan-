<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✦ Planet 3D Interaktif</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0e1a;
            overflow: hidden;
            color: #fff;
        }

        #info-panel {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 14, 30, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 24px 32px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.4s ease;
            transform: translateX(-50%) translateY(20px);
            pointer-events: none;
            z-index: 20;
        }
        #info-panel.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        #info-panel h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #f0c27f, #fc5c7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #info-panel .sub {
            font-size: 0.9rem;
            color: #aab;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        #info-panel p {
            font-size: 1rem;
            line-height: 1.6;
            color: #ccd;
            font-weight: 300;
        }
        #info-panel .close-btn {
            margin-top: 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        #info-panel .close-btn:hover {
            background: rgba(255,255,255,0.12);
        }

        #hint {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.25);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 5;
        }

        /* Tombol reset view (opsional) */
        #reset-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            backdrop-filter: blur(8px);
            z-index: 10;
            transition: background 0.2s;
        }
        #reset-btn:hover {
            background: rgba(255,255,255,0.12);
        }

        @media (max-width: 640px) {
            #info-panel { padding: 20px; bottom: 30px; }
            #info-panel h2 { font-size: 1.4rem; }
            #hint { bottom: 100px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <!-- Panel Info -->
    <div id="info-panel">
        <h2 id="planet-name">Bumi</h2>
        <div class="sub" id="planet-sub">🌍 Planet Biru</div>
        <p id="planet-desc">Bumi adalah planet ketiga dari Matahari dan satu-satunya planet yang diketahui memiliki kehidupan.</p>
        <button class="close-btn" id="close-info">Tutup</button>
    </div>

    <div id="hint">🪐 Klik planet untuk melihat info</div>
    <button id="reset-btn">↺ Reset Kamera</button>

    <!-- Impor Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ----- 1. IMPOR -----
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ----- 2. SETUP SCENE, CAMERA, RENDERER -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0e1a);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3, 12);

        // Renderer WebGL
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // Renderer CSS2D untuk label (opsional, tapi kita pakai untuk info click)
        // Kita tidak pakai label, kita pakai event click

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;
        controls.minDistance = 4;
        controls.maxDistance = 20;
        controls.target.set(0, 0, 0);

        // ----- 3. LIGHTING -----
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);

        const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
        mainLight.position.set(5, 8, 6);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x7b6eff, 1.0);
        fillLight.position.set(-4, 2, -3);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xff7eb3, 0.6);
        rimLight.position.set(-2, -1, -5);
        scene.add(rimLight);

        // Bintang latar (efek)
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 3000;
        const starPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            starPos[i] = (Math.random() - 0.5) * 200;
            starPos[i+1] = (Math.random() - 0.5) * 200;
            starPos[i+2] = (Math.random() - 0.5) * 200 - 50;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8 });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // ----- 4. DATA PLANET -----
        const planetData = [
            {
                name: 'Bumi',
                sub: '🌍 Planet Biru',
                desc: 'Bumi adalah planet ketiga dari Matahari dan satu-satunya planet yang diketahui memiliki kehidupan. Memiliki atmosfer yang kaya oksigen dan air cair.',
                color: 0x2a6f8f,
                emissive: 0x0a2a3a,
                size: 1.0,
                pos: [-2.8, 0, 0]
            },
            {
                name: 'Mars',
                sub: '🔴 Planet Merah',
                desc: 'Mars adalah planet keempat dari Matahari. Dikenal sebagai "planet merah" karena oksida besi di permukaannya. Memiliki gunung tertinggi di tata surya, Olympus Mons.',
                color: 0xc1440e,
                emissive: 0x3a1a0a,
                size: 0.8,
                pos: [0, 0.2, 0]
            },
            {
                name: 'Jupiter',
                sub: '🟠 Raksasa Gas',
                desc: 'Jupiter adalah planet terbesar di tata surya. Terkenal dengan Bintik Merah Besar-nya, sebuah badai raksasa yang telah berlangsung selama ratusan tahun.',
                color: 0xd4a373,
                emissive: 0x2a1a0a,
                size: 1.6,
                pos: [2.8, -0.3, 0]
            }
        ];

        // ----- 5. BUAT PLANET DAN TAMBAHKAN KE SCENE -----
        const planets = [];

        planetData.forEach((data, index) => {
            // Buat sphere dengan tekstur sederhana (gradasi)
            const geometry = new THREE.SphereGeometry(data.size, 64, 64);

            // Buat material dengan warna dan sedikit emissive
            const material = new THREE.MeshStandardMaterial({
                color: data.color,
                emissive: data.emissive,
                emissiveIntensity: 0.2,
                metalness: 0.1,
                roughness: 0.6,
            });

            // Untuk Bumi, kita tambahkan tekstur dari internet (opsional)
            // Tapi biar simpel, kita buat planet dengan pola yang menarik
            // Sebenarnya kita bisa buat texture procedurally, tapi untuk demo ini kita pakai warna + sedikit detail

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(data.pos[0], data.pos[1], data.pos[2]);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { planetIndex: index }; // simpan index untuk identifikasi

            scene.add(mesh);

            // Simpan referensi planet beserta datanya
            planets.push({
                mesh: mesh,
                data: data,
                // Buat atmosfer tipis (glow) untuk Bumi dan Jupiter? Tidak wajib
            });

            // Tambahkan "cincin" untuk Jupiter
            if (index === 2) { // Jupiter
                const ringGeo = new THREE.TorusGeometry(data.size * 1.4, 0.06, 16, 64);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: 0x8a6e4b,
                    emissive: 0x2a1a0a,
                    emissiveIntensity: 0.1,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.3
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.copy(mesh.position);
                ring.rotation.x = Math.PI / 2.5;
                ring.rotation.z = 0.3;
                scene.add(ring);
                // Simpan ring untuk animasi (opsional)
                mesh.userData.ring = ring;
            }

            // Tambahkan "bulan" kecil untuk Bumi (opsional)
            if (index === 0) {
                const moonGeo = new THREE.SphereGeometry(0.15, 16, 16);
                const moonMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.8 });
                const moon = new THREE.Mesh(moonGeo, moonMat);
                moon.position.set(data.pos[0] + 1.5, data.pos[1] + 0.5, data.pos[2] + 0.2);
                scene.add(moon);
            }
        });

        // ----- 6. RAYCASTER UNTUK KLIK -----
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        // Elemen info panel
        const infoPanel = document.getElementById('info-panel');
        const planetName = document.getElementById('planet-name');
        const planetSub = document.getElementById('planet-sub');
        const planetDesc = document.getElementById('planet-desc');
        const closeBtn = document.getElementById('close-info');

        function showPlanetInfo(index) {
            const data = planetData[index];
            planetName.textContent = data.name;
            planetSub.textContent = data.sub;
            planetDesc.textContent = data.desc;
            infoPanel.classList.add('show');
        }

        function hideInfo() {
            infoPanel.classList.remove('show');
        }

        closeBtn.addEventListener('click', hideInfo);

        // Event klik pada canvas
        renderer.domElement.addEventListener('click', (event) => {
            // Hitung posisi pointer
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);

            // Ambil semua mesh planet (kita simpan di array planets)
            const meshes = planets.map(p => p.mesh);
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                const index = hitMesh.userData.planetIndex;
                if (index !== undefined) {
                    showPlanetInfo(index);
                    // Sedikit efek: planet yang diklik berkedip? Tidak, biar simpel
                }
            }
        });

        // Reset kamera
        document.getElementById('reset-btn').addEventListener('click', () => {
            camera.position.set(0, 3, 12);
            controls.target.set(0, 0, 0);
            controls.update();
        });

        // ----- 7. RESPONSIF -----
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ----- 8. LOOP ANIMASI -----
        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            // Animasi rotasi planet (dan ring)
            planets.forEach((p, idx) => {
                p.mesh.rotation.y += 0.003;
                if (p.mesh.userData.ring) {
                    p.mesh.userData.ring.rotation.y += 0.001;
                }
            });

            // Animasi bintang berputar sangat lambat
            stars.rotation.y += 0.0001;

            renderer.render(scene, camera);
        }

        animate();

        // Log
        console.log('🚀 Planet 3D siap! Klik planet untuk info.');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Source 3D Assets — Galeri Model</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300&display=swap" rel="stylesheet" />
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0c14;
            color: #f0f0f5;
            min-height: 100vh;
            padding: 24px 20px 60px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #a78bfa, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header .badge {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 16px;
            border-radius: 100px;
            color: #aab;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* Status & Filter */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }

        .status {
            font-size: 0.9rem;
            color: #8899bb;
        }

        .status .count {
            color: #f0f0f5;
            font-weight: 600;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #8899bb;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .filter-btn.active {
            background: rgba(167, 139, 250, 0.15);
            border-color: rgba(167, 139, 250, 0.3);
            color: #c4b5fd;
        }

        /* Grid Galeri */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        /* Kartu Model */
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(167, 139, 250, 0.2);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .card .thumbnail {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #111422;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .card .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover .thumbnail img {
            transform: scale(1.05);
        }

        .card .thumbnail .fallback {
            color: #445;
            font-size: 0.7rem;
            text-align: center;
            padding: 12px;
        }

        .card .info {
            padding: 14px 16px 16px;
        }

        .card .info .name {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card .info .collection {
            font-size: 0.7rem;
            color: #667799;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card .info .size {
            font-size: 0.65rem;
            color: #445566;
            margin-top: 4px;
        }

        .card .view-btn {
            position: absolute;
            bottom: 60px;
            right: 12px;
            background: rgba(167, 139, 250, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(167, 139, 250, 0.2);
            color: #c4b5fd;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.65rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .card:hover .view-btn {
            opacity: 1;
        }

        /* Modal Viewer */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.open {
            display: flex;
            opacity: 1;
        }

        .modal {
            background: #141824;
            border-radius: 24px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
        }

        .modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .modal .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal .modal-header .close {
            background: none;
            border: none;
            color: #8899bb;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 8px;
            transition: color 0.2s;
        }

        .modal .modal-header .close:hover {
            color: #f0f0f5;
        }

        .modal .viewer-wrap {
            flex: 1;
            min-height: 400px;
            background: #0a0c14;
            position: relative;
        }

        .modal .viewer-wrap model-viewer {
            width: 100%;
            height: 100%;
            min-height: 400px;
            display: block;
        }

        .modal .modal-footer {
            padding: 12px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.8rem;
            color: #8899bb;
        }

        .modal .modal-footer a {
            color: #a78bfa;
            text-decoration: none;
            border-bottom: 1px dotted rgba(167, 139, 250, 0.3);
        }

        .modal .modal-footer a:hover {
            color: #c4b5fd;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #667799;
        }

        .loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsif */
        @media (max-width: 640px) {
            body {
                padding: 16px 12px 40px;
            }
            header h1 {
                font-size: 1.3rem;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }
            .card .info {
                padding: 10px 12px 12px;
            }
            .card .info .name {
                font-size: 0.75rem;
            }
            .modal {
                max-height: 95vh;
            }
            .modal .viewer-wrap {
                min-height: 300px;
            }
            .modal .viewer-wrap model-viewer {
                min-height: 300px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-group {
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 4px;
            }
            .filter-btn {
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>✦ Open Source 3D Assets</h1>
            <span class="badge">CC0 · 900+ model</span>
        </header>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="status">
                Menampilkan <span class="count" id="modelCount">0</span> model
            </div>
            <div class="filter-group" id="filterGroup">
                <button class="filter-btn active" data-filter="all">Semua</button>
                <!-- Filter akan diisi otomatis dari koleksi -->
            </div>
        </div>

        <!-- Grid -->
        <div class="grid" id="modelGrid">
            <div class="loading">
                <div class="spinner"></div>
                <div>Memuat model 3D ...</div>
            </div>
        </div>
    </div>

    <!-- Modal Viewer -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Model 3D</h3>
                <button class="close" id="modalClose">✕</button>
            </div>
            <div class="viewer-wrap" id="modalViewerWrap">
                <model-viewer
                    id="modalViewer"
                    src=""
                    alt="Model 3D"
                    camera-controls
                    touch-action="pan-y"
                    auto-rotate
                    rotation-per-second="30deg"
                    shadow-intensity="0.4"
                    exposure="1.0"
                    environment-image="neutral"
                    style="width: 100%; height: 100%; min-height: 400px; background: #0a0c14;"
                >
                </model-viewer>
            </div>
            <div class="modal-footer">
                <span id="modalInfo">Klik &amp; geser untuk memutar</span>
                <a id="modalLink" href="#" target="_blank">🔗 Buka Raw URL</a>
            </div>
        </div>
    </div>

    <!-- Load model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js">
    </script>

    <script>
        (function() {
            'use strict';

            // ----- Konfigurasi -----
            const BASE_URL =
                'https://raw.githubusercontent.com/ToxSam/open-source-3d-assets/main/data/';
            const PROJECTS_URL = BASE_URL + 'projects.json';

            // ----- State -----
            let allModels = [];
            let filteredModels = [];
            let currentFilter = 'all';
            let collections = [];

            // ----- DOM -----
            const grid = document.getElementById('modelGrid');
            const modelCount = document.getElementById('modelCount');
            const filterGroup = document.getElementById('filterGroup');

            // Modal
            const overlay = document.getElementById('modalOverlay');
            const viewer = document.getElementById('modalViewer');
            const modalTitle = document.getElementById('modalTitle');
            const modalInfo = document.getElementById('modalInfo');
            const modalLink = document.getElementById('modalLink');
            const closeBtn = document.getElementById('modalClose');

            // ----- Utility -----
            function formatSize(bytes) {
                if (!bytes) return '';
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            }

            function slugify(text) {
                return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            }

            // ----- Ambil data dari GitHub -----
            async function fetchData() {
                try {
                    // 1. Ambil projects.json
                    const projRes = await fetch(PROJECTS_URL);
                    if (!projRes.ok) throw new Error('Gagal mengambil projects.json');
                    const projects = await projRes.json();

                    // 2. Kumpulkan semua asset_data_file
                    const assetFiles = projects
                        .filter(p => p.is_public !== false)
                        .map(p => p.asset_data_file);

                    collections = projects.filter(p => p.is_public !== false);

                    // 3. Ambil setiap asset file
                    const allAssets = [];
                    for (const file of assetFiles) {
                        try {
                            const url = BASE_URL + file;
                            const res = await fetch(url);
                            if (!res.ok) continue;
                            const data = await res.json();
                            // Cari tahu nama koleksi dari projects
                            const project = projects.find(p => p.asset_data_file === file);
                            const collectionName = project ? project.name : file.replace('assets/pm-', '').replace(
                            '.json', '');
                            // Tambahkan data koleksi ke setiap asset
                            data.forEach(asset => {
                                asset.collection = collectionName;
                                asset.project_id = project ? project.id : null;
                            });
                            allAssets.push(...data);
                        } catch (e) {
                            console.warn('Gagal memuat:', file, e);
                        }
                    }

                    return allAssets;

                } catch (error) {
                    console.error('Error:', error);
                    throw error;
                }
            }

            // ----- Render Filter -----
            function renderFilters() {
                // Ambil semua nama koleksi unik
                const names = new Set();
                collections.forEach(c => {
                    if (c.is_public !== false) names.add(c.name);
                });

                // Hapus semua kecuali "Semua"
                const allBtn = filterGroup.querySelector('[data-filter="all"]');
                filterGroup.innerHTML = '';
                filterGroup.appendChild(allBtn);

                // Tambahkan filter untuk setiap koleksi
                const sorted = Array.from(names).sort();
                sorted.forEach(name => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.dataset.filter = name;
                    btn.textContent = name;
                    btn.addEventListener('click', () => {
                        setFilter(name);
                    });
                    filterGroup.appendChild(btn);
                });

                // Set active
                updateFilterButtons();
            }

            function updateFilterButtons() {
                const btns = filterGroup.querySelectorAll('.filter-btn');
                btns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === currentFilter);
                });
            }

            function setFilter(filter) {
                currentFilter = filter;
                updateFilterButtons();
                applyFilter();
            }

            // ----- Filter & Render -----
            function applyFilter() {
                if (currentFilter === 'all') {
                    filteredModels = allModels;
                } else {
                    filteredModels = allModels.filter(m => m.collection === currentFilter);
                }
                renderGrid();
            }

            // ----- Render Grid -----
            function renderGrid() {
                if (filteredModels.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:#667799;">
                            <div style="font-size:2rem; margin-bottom:12px;">🔍</div>
                            <p>Tidak ada model ditemukan untuk koleksi ini.</p>
                        </div>
                    `;
                    modelCount.textContent = '0';
                    return;
                }

                modelCount.textContent = filteredModels.length;

                let html = '';
                filteredModels.forEach((model, index) => {
                    const name = model.name || 'Model ' + (index + 1);
                    const collection = model.collection || 'Umum';
                    const size = formatSize(model.metadata?.file_size);
                    const thumb = model.thumbnail_url || '';
                    const modelUrl = model.model_file_url || '';

                    html += `
                        <div class="card" data-url="${modelUrl}" data-name="${name}" data-collection="${collection}" data-size="${size}">
                            <div class="thumbnail">
                                ${thumb ? `<img src="${thumb}" alt="${name}" loading="lazy" onerror="this.style.display='none'" />` : ''}
                                <div class="fallback" style="${thumb ? 'display:none;' : ''}">
                                    <div style="font-size:2rem; margin-bottom:4px;">🧊</div>
                                    <div>${name}</div>
                                </div>
                                <span class="view-btn">Lihat 3D</span>
                            </div>
                            <div class="info">
                                <div class="name" title="${name}">${name}</div>
                                <div class="collection">${collection}</div>
                                ${size ? `<div class="size">${size}</div>` : ''}
                            </div>
                        </div>
                    `;
                });

                grid.innerHTML = html;

                // Event klik pada card
                document.querySelectorAll('.card').forEach(card => {
                    card.addEventListener('click', function() {
                        const url = this.dataset.url;
                        const name = this.dataset.name;
                        const collection = this.dataset.collection;
                        if (url) {
                            openModal(url, name, collection);
                        }
                    });
                });
            }

            // ----- Modal -----
            function openModal(url, name, collection) {
                viewer.src = url;
                modalTitle.textContent = name || 'Model 3D';
                modalInfo.textContent = collection ? `Koleksi: ${collection} · Klik & geser untuk memutar` :
                    'Klik & geser untuk memutar';
                modalLink.href = url;
                overlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                overlay.classList.remove('open');
                document.body.style.overflow = '';
                // Reset viewer agar tidak loading terus
                setTimeout(() => {
                    viewer.src = '';
                }, 300);
            }

            // Event modal
            closeBtn.addEventListener('click', closeModal);
            overlay.addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
            });

            // ----- Init -----
            async function init() {
                try {
                    const data = await fetchData();
                    allModels = data;
                    filteredModels = data;
                    renderFilters();
                    renderGrid();

                    // Set filter default
                    setFilter('all');

                } catch (error) {
                    grid.innerHTML = `
                        <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:#667799;">
                            <div style="font-size:3rem; margin-bottom:16px;">⚠️</div>
                            <p style="font-size:1.1rem; margin-bottom:8px;">Gagal memuat data</p>
                            <p style="font-size:0.9rem;">${error.message}</p>
                            <button onclick="location.reload()" style="margin-top:20px; background:rgba(167,139,250,0.15); border:1px solid rgba(167,139,250,0.2); color:#c4b5fd; padding:8px 24px; border-radius:100px; cursor:pointer; font-family:inherit;">Muat Ulang</button>
                        </div>
                    `;
                }
            }

            // Jalankan
            init();

        })();
    </script>

</body>
</html>

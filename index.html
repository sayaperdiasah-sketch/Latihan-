<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✦ Planet 3D — All Planets Showcase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0e1a;
            overflow: hidden;
            color: #fff;
        }

        /* Panel info di sisi kiri */
        #info-panel {
            position: absolute;
            top: 50%;
            left: 40px;
            transform: translateY(-50%);
            width: 320px;
            max-width: 70vw;
            background: rgba(10, 14, 30, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 32px 28px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.4s ease;
            transform: translateY(-50%) translateX(-20px);
            z-index: 20;
        }
        #info-panel.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) translateX(0);
        }
        #info-panel .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 40px;
            transition: background 0.2s;
            line-height: 1;
        }
        #info-panel .close-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        #info-panel h2 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #f0c27f, #fc5c7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #info-panel .sub {
            font-size: 1rem;
            color: #aab;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }
        #info-panel p {
            font-size: 1rem;
            line-height: 1.7;
            color: #ccd;
            font-weight: 300;
        }
        #info-panel .detail {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #8899bb;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 14px;
        }

        /* Highlight indicator pada planet yang dipilih */
        .planet-highlight {
            outline: 2px solid rgba(255, 215, 0, 0.3);
            outline-offset: 6px;
        }

        #hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.6s;
        }
        #hint.hidden {
            opacity: 0;
        }

        #reset-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            backdrop-filter: blur(8px);
            z-index: 10;
            transition: background 0.2s;
            display: none;
        }
        #reset-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        #reset-btn.visible {
            display: block;
        }

        @media (max-width: 640px) {
            #info-panel {
                left: 20px;
                right: 20px;
                width: auto;
                top: auto;
                bottom: 30px;
                transform: none;
                border-radius: 20px;
                padding: 24px 20px;
                max-height: 60vh;
                overflow-y: auto;
            }
            #info-panel.show {
                transform: none;
            }
            #info-panel h2 {
                font-size: 1.6rem;
            }
            #hint {
                bottom: 100px;
                font-size: 0.7rem;
            }
            #reset-btn {
                top: 16px;
                right: 16px;
                padding: 6px 14px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <!-- Panel info kiri -->
    <div id="info-panel">
        <button class="close-btn" id="close-info">✕</button>
        <h2 id="planet-name">Bumi</h2>
        <div class="sub" id="planet-sub">🌍 Planet Biru</div>
        <p id="planet-desc">Bumi adalah planet ketiga dari Matahari dan satu-satunya planet yang diketahui memiliki kehidupan.</p>
        <div class="detail" id="planet-detail">Diameter: 12.742 km • Jarak: 1 AU</div>
    </div>

    <div id="hint">🪐 Klik planet untuk melihat info</div>
    <button id="reset-btn">↺ Kembali</button>

    <!-- Impor Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ----- 1. IMPOR -----
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ----- 2. SETUP SCENE, CAMERA, RENDERER -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0e1a);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2.5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.6;
        controls.minDistance = 3;
        controls.maxDistance = 20;
        controls.target.set(0, 0, 0);

        // ----- 3. LIGHTING -----
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);

        const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
        mainLight.position.set(5, 8, 6);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x7b6eff, 1.0);
        fillLight.position.set(-4, 2, -3);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xff7eb3, 0.6);
        rimLight.position.set(-2, -1, -5);
        scene.add(rimLight);

        // Bintang latar
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 3000;
        const starPos = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            starPos[i] = (Math.random() - 0.5) * 200;
            starPos[i+1] = (Math.random() - 0.5) * 200;
            starPos[i+2] = (Math.random() - 0.5) * 200 - 50;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.6 });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // ----- 4. DATA PLANET -----
        const planetData = [{
            name: 'Bumi',
            sub: '🌍 Planet Biru',
            desc: 'Bumi adalah planet ketiga dari Matahari dan satu-satunya planet yang diketahui memiliki kehidupan. Memiliki atmosfer kaya oksigen dan air cair.',
            detail: 'Diameter: 12.742 km • Jarak: 1 AU',
            color: 0x2a6f8f,
            emissive: 0x0a2a3a,
            size: 1.0,
            pos: [-2.8, 1.2, 0]
        }, {
            name: 'Mars',
            sub: '🔴 Planet Merah',
            desc: 'Mars adalah planet keempat dari Matahari. Dikenal sebagai "planet merah" karena oksida besi di permukaannya. Memiliki gunung tertinggi, Olympus Mons.',
            detail: 'Diameter: 6.779 km • Jarak: 1.5 AU',
            color: 0xc1440e,
            emissive: 0x3a1a0a,
            size: 0.8,
            pos: [0, 0.0, 0]
        }, {
            name: 'Jupiter',
            sub: '🟠 Raksasa Gas',
            desc: 'Jupiter adalah planet terbesar di tata surya. Terkenal dengan Bintik Merah Besar, badai raksasa yang telah berlangsung selama ratusan tahun.',
            detail: 'Diameter: 139.820 km • Jarak: 5.2 AU',
            color: 0xd4a373,
            emissive: 0x2a1a0a,
            size: 1.6,
            pos: [2.8, -1.2, 0]
        }];

        // ----- 5. BUAT PLANET & SIMPAN POSISI -----
        const planets = [];
        const planetMeshes = [];

        // Posisi awal (diambil dari data)
        const initialPositions = planetData.map(d => new THREE.Vector3(d.pos[0], d.pos[1], d.pos[2]));

        // Posisi saat zoom (semua di kanan, berderet vertikal)
        const zoomedPositions = planetData.map((data, idx) => {
            // Spasi vertikal 1.8, dan posisi X seragam 3.8
            const yOffset = (idx - 1) * 1.8;
            return new THREE.Vector3(3.8, yOffset, 0);
        });

        planetData.forEach((data, index) => {
            const geometry = new THREE.SphereGeometry(data.size, 64, 64);
            const material = new THREE.MeshStandardMaterial({
                color: data.color,
                emissive: data.emissive,
                emissiveIntensity: 0.2,
                metalness: 0.1,
                roughness: 0.6,
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(initialPositions[index]);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { planetIndex: index };
            scene.add(mesh);
            planetMeshes.push(mesh);

            // Simpan data planet
            const planetObj = {
                mesh: mesh,
                data: data,
                initialPos: initialPositions[index].clone(),
                zoomedPos: zoomedPositions[index].clone(),
                ring: null,
                initialRingPos: null,
                zoomedRingPos: null,
            };

            // Cincin untuk Jupiter
            if (index === 2) {
                const ringGeo = new THREE.TorusGeometry(data.size * 1.4, 0.06, 16, 64);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: 0x8a6e4b,
                    emissive: 0x2a1a0a,
                    emissiveIntensity: 0.1,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.3
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.copy(initialPositions[index]);
                ring.rotation.x = Math.PI / 2.5;
                ring.rotation.z = 0.3;
                scene.add(ring);
                planetObj.ring = ring;
                planetObj.initialRingPos = initialPositions[index].clone();
                planetObj.zoomedRingPos = zoomedPositions[index].clone();
            }

            planets.push(planetObj);
        });

        // ----- 6. STATE UNTUK ANIMASI -----
        let isAnimating = false;
        let animProgress = 0;
        const animDuration = 1.2; // detik

        const initialCamPos = new THREE.Vector3(0, 2.5, 10);
        const initialTarget = new THREE.Vector3(0, 0, 0);

        let targetCamPos = new THREE.Vector3();
        let targetLookAt = new THREE.Vector3();
        let selectedPlanetIndex = -1;
        let isZoomed = false;

        // UI Elements
        const infoPanel = document.getElementById('info-panel');
        const planetName = document.getElementById('planet-name');
        const planetSub = document.getElementById('planet-sub');
        const planetDesc = document.getElementById('planet-desc');
        const planetDetail = document.getElementById('planet-detail');
        const closeBtn = document.getElementById('close-info');
        const resetBtn = document.getElementById('reset-btn');
        const hintEl = document.getElementById('hint');

        // ----- 7. FUNGSI ZOOM IN (Semua planet bergerak) -----
        function zoomToPlanet(index) {
            if (isAnimating || isZoomed) return;
            if (index < 0 || index >= planets.length) return;

            selectedPlanetIndex = index;
            isZoomed = true;
            isAnimating = true;
            animProgress = 0;

            // Target kamera: lihat ke arah kanan (ke deretan planet)
            targetCamPos.set(-3.5, 1.5, 5.5);
            targetLookAt.set(3.8, 0, 0);

            hintEl.classList.add('hidden');
            resetBtn.classList.add('visible');
            infoPanel.classList.remove('show');

            // Highlight efek (opsional)
            planetMeshes.forEach((mesh, i) => {
                mesh.material.emissiveIntensity = (i === index) ? 0.6 : 0.2;
            });
        }

        // ----- 8. FUNGSI RESET (Kembali ke semula) -----
        function resetView() {
            if (isAnimating || !isZoomed) return;
            isAnimating = true;
            animProgress = 0;
            isZoomed = false;

            targetCamPos.copy(initialCamPos);
            targetLookAt.copy(initialTarget);

            infoPanel.classList.remove('show');

            // Reset highlight
            planetMeshes.forEach(mesh => {
                mesh.material.emissiveIntensity = 0.2;
            });
        }

        // ----- 9. RAYCASTER UNTUK KLIK -----
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (event) => {
            if (isAnimating) return;
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(planetMeshes);

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                const idx = hit.userData.planetIndex;
                if (idx !== undefined && !isZoomed) {
                    zoomToPlanet(idx);
                }
            }
        });

        // ----- 10. UI EVENT -----
        closeBtn.addEventListener('click', () => {
            if (isZoomed && !isAnimating) resetView();
        });

        resetBtn.addEventListener('click', () => {
            if (isZoomed && !isAnimating) resetView();
        });

        // ----- 11. RESPONSIF -----
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ----- 12. LOOP ANIMASI UTAMA -----
        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Proses animasi
            if (isAnimating) {
                animProgress += 0.016 / animDuration;
                if (animProgress >= 1) {
                    animProgress = 1;
                    isAnimating = false;

                    if (isZoomed) {
                        // Tampilkan info planet yang dipilih
                        const idx = selectedPlanetIndex;
                        if (idx !== -1) {
                            const data = planetData[idx];
                            planetName.textContent = data.name;
                            planetSub.textContent = data.sub;
                            planetDesc.textContent = data.desc;
                            planetDetail.textContent = data.detail;
                            infoPanel.classList.add('show');
                        }
                    } else {
                        // Reset selesai
                        selectedPlanetIndex = -1;
                        resetBtn.classList.remove('visible');
                        hintEl.classList.remove('hidden');
                        infoPanel.classList.remove('show');
                    }
                }

                const t = easeInOutCubic(animProgress);

                // 1. Gerakkan SEMUA planet
                planets.forEach((planet, idx) => {
                    const startPos = isZoomed ? planet.initialPos : planet.zoomedPos;
                    const endPos = isZoomed ? planet.zoomedPos : planet.initialPos;
                    const currentPos = new THREE.Vector3().lerpVectors(startPos, endPos, t);
                    planet.mesh.position.copy(currentPos);

                    if (planet.ring) {
                        const ringStart = isZoomed ? planet.initialRingPos : planet.zoomedRingPos;
                        const ringEnd = isZoomed ? planet.zoomedRingPos : planet.initialRingPos;
                        const ringPos = new THREE.Vector3().lerpVectors(ringStart, ringEnd, t);
                        planet.ring.position.copy(ringPos);
                    }
                });

                // 2. Gerakkan kamera
                const camStart = isZoomed ? initialCamPos : targetCamPos;
                const camEnd = isZoomed ? targetCamPos : initialCamPos;
                camera.position.lerpVectors(camStart, camEnd, t);

                const targetStart = isZoomed ? initialTarget : targetLookAt;
                const targetEnd = isZoomed ? targetLookAt : initialTarget;
                controls.target.lerpVectors(targetStart, targetEnd, t);

                controls.update();

            } else {
                // Idle: auto-rotate berjalan
                controls.update();
            }

            // Rotasi planet (selalu berputar)
            planets.forEach((p) => {
                p.mesh.rotation.y += 0.004;
                if (p.ring) {
                    p.ring.rotation.y += 0.001;
                }
            });

            stars.rotation.y += 0.0001;
            renderer.render(scene, camera);
        }

        // Inisialisasi target
        targetCamPos.copy(initialCamPos);
        targetLookAt.copy(initialTarget);

        animate();
        console.log('🚀 Semua planet siap! Klik salah satu untuk zoom & info.');
    </script>
</body>
</html>

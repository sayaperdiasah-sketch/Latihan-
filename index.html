<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✦ Tombol 3D Interaktif</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            letter-spacing: 1px;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #status {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 10px 28px;
            border-radius: 40px;
            color: #fff;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 10;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        #status.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="status">✨ Tombol ditekan!</div>
    <div id="info">🖱️ Klik tombolnya &bull; Geser untuk putar &bull; Gulung untuk zoom</div>

    <!-- Memuat Three.js dari CDN (Tool 3D) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ----- 1. IMPOR TOOL -----
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ----- 2. SETUP SCENE, CAMERA, RENDERER -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a); // Biru tua elegan

        // Kamera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(4, 3, 6);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // Kontrol (bisa diputar)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2.0;
        controls.minDistance = 2.5;
        controls.maxDistance = 12;
        controls.target.set(0, 0.2, 0);

        // ----- 3. PENCIPTAAN CAHAYA (Biar kinclong) -----
        // Cahaya ambient lembut
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // Cahaya utama dari depan
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
        mainLight.position.set(2, 5, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);

        // Cahaya pengisi dari belakang
        const backLight = new THREE.DirectionalLight(0x7b6eff, 0.8);
        backLight.position.set(-3, 1, -4);
        scene.add(backLight);

        // Lampu sorot warna-warni untuk efek
        const colorLight = new THREE.PointLight(0xff4d6d, 0.6, 10);
        colorLight.position.set(2, 1, 2);
        scene.add(colorLight);

        const colorLight2 = new THREE.PointLight(0x4d9eff, 0.6, 10);
        colorLight2.position.set(-2, 0.5, 2);
        scene.add(colorLight2);

        // ----- 4. LANTAI BAYANGAN (Biar tombol kelihatan nempel) -----
        const floorGeometry = new THREE.PlaneGeometry(8, 8);
        const floorMaterial = new THREE.ShadowMaterial({ opacity: 0.3, color: 0x000000 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        scene.add(floor);

        // ----- 5. BIKIN TOMBOL 3D (Objek utama) -----
        const buttonGroup = new THREE.Group();
        buttonGroup.position.y = 0;

        // --- 5a. Base (Bawah) ---
        const baseGeo = new THREE.CylinderGeometry(1.4, 1.4, 0.4, 48);
        const baseMat = new THREE.MeshStandardMaterial({
            color: 0x2a2a4a,
            metalness: 0.85,
            roughness: 0.25,
            emissive: 0x111122,
            emissiveIntensity: 0.1
        });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = 0;
        base.castShadow = true;
        base.receiveShadow = true;
        buttonGroup.add(base);

        // Ring aksen (cincin di tengah base)
        const ringGeo = new THREE.TorusGeometry(1.1, 0.06, 16, 48);
        const ringMat = new THREE.MeshStandardMaterial({
            color: 0x7b6eff,
            metalness: 0.9,
            roughness: 0.2,
            emissive: 0x3b2bff,
            emissiveIntensity: 0.2
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.y = 0.22;
        ring.rotation.x = Math.PI / 2;
        buttonGroup.add(ring);

        // --- 5b. Tombol Atas (yang bisa ditekan) ---
        const capGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.35, 48);
        const capMat = new THREE.MeshStandardMaterial({
            color: 0x4f6ef7,
            metalness: 0.3,
            roughness: 0.4,
            emissive: 0x1a2b9c,
            emissiveIntensity: 0.15
        });
        const cap = new THREE.Mesh(capGeo, capMat);
        cap.position.y = 0.4;
        cap.castShadow = true;
        cap.receiveShadow = true;
        buttonGroup.add(cap);

        // --- 5c. Lampu indikator kecil di atas tombol ---
        const ledGeo = new THREE.SphereGeometry(0.12, 16, 16);
        const ledMat = new THREE.MeshStandardMaterial({
            color: 0x00ff88,
            emissive: 0x00ff88,
            emissiveIntensity: 1.5,
            metalness: 0.1,
            roughness: 0.1
        });
        const led = new THREE.Mesh(ledGeo, ledMat);
        led.position.set(0, 0.6, 0.7);
        buttonGroup.add(led);

        // Tambahkan group ke scene
        scene.add(buttonGroup);

        // Simpan referensi cap dan led untuk animasi
        const buttonCap = cap;
        const ledLight = led;

        // ----- 6. INTERAKSI KLIK (Raycaster) -----
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        // Ambil elemen status
        const statusEl = document.getElementById('status');

        function onPointerDown(event) {
            // Hitung posisi pointer (koordinat layar -1 sampai 1)
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);

            // Cek apakah mengenai "cap" (tombol atas)
            const intersects = raycaster.intersectObject(buttonCap);

            if (intersects.length > 0) {
                // ---- Tombol Ditekan! ----
                // 1. Animasi turun
                buttonCap.position.y = 0.25; // Turun
                // 2. Ubah warna LED jadi merah
                ledLight.material.color.setHex(0xff3366);
                ledLight.material.emissive.setHex(0xff3366);
                // 3. Tampilkan notifikasi
                statusEl.textContent = '✨ Tombol ditekan!';
                statusEl.classList.add('show');
                // 4. Efek getar kecil (opsional)
                buttonGroup.rotation.z = 0.03;
                setTimeout(() => {
                    buttonGroup.rotation.z = -0.03;
                    setTimeout(() => {
                        buttonGroup.rotation.z = 0;
                    }, 50);
                }, 50);

                // Kembalikan ke posisi semula setelah 300ms
                setTimeout(() => {
                    buttonCap.position.y = 0.4; // Naik
                    ledLight.material.color.setHex(0x00ff88);
                    ledLight.material.emissive.setHex(0x00ff88);
                    statusEl.classList.remove('show');
                }, 300);
            }
        }

        // Event listener klik
        renderer.domElement.addEventListener('click', onPointerDown);

        // ----- 7. RESPONSIF (Ukuran layar berubah) -----
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ----- 8. LOOP ANIMASI -----
        function animate() {
            requestAnimationFrame(animate);

            // Update kontrol (termasuk auto-rotate)
            controls.update();

            // Animasi LED berkedip pelan (efek hidup)
            const time = Date.now() * 0.001;
            ledLight.material.emissiveIntensity = 1.0 + Math.sin(time * 2) * 0.5;

            renderer.render(scene, camera);
        }

        animate();

        // Petunjuk di console
        console.log('🚀 Tombol 3D siap! Klik tombol biru untuk mencoba.');
    </script>
</body>
</html>
